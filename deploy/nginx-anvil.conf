# /etc/nginx/sites-available/anvil  — symlink into sites-enabled, then certbot.
server {
    listen 80;
    server_name anvil.satimon.com;

    # Jobs return signed artifact URLs; bodies are capped at MAX_BODY_BYTES.
    client_max_body_size 36m;

    location / {
        proxy_pass http://127.0.0.1:4021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Jobs can take minutes (doc conversion, research, sandbox runs).
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # 402 payment-required headers run ~4-6KB on schema-rich routes
        # (e.g. /v1/browse/act); the default 4KB buffer 502s the response.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }
}
