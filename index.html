<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Space Cats</title>
<style>
  :root {
    --bg: #05040f;
    --fg: #f4f1ff;
    --accent: #ffb347;
    --muted: #9a93c9;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: "Trebuchet MS", system-ui, sans-serif;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    background: var(--bg);
    image-rendering: auto;
    max-width: 100vw;
    max-height: 100vh;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<script>
(() => {
  "use strict";

  // ---------- Setup ----------
  const W = 480, H = 720;
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  function resize() {
    const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = Math.floor(W * scale) + "px";
    canvas.style.height = Math.floor(H * scale) + "px";
    canvas.width = Math.floor(W * scale * dpr);
    canvas.height = Math.floor(H * scale * dpr);
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const dist2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
  const hit = (a, b) => dist2(a, b) < (a.r + b.r) ** 2;

  function loadHigh() {
    try { return Number(localStorage.getItem("spacecats.high")) || 0; } catch { return 0; }
  }
  function saveHigh(v) {
    try { localStorage.setItem("spacecats.high", String(v)); } catch {}
  }

  // ---------- Audio (tiny synth) ----------
  let audio = null, muted = false;
  function ensureAudio() {
    if (!audio) {
      try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch { audio = null; }
    }
    if (audio && audio.state === "suspended") audio.resume();
  }
  function beep(freq, dur, type = "square", vol = 0.05, slide = 0) {
    if (!audio || muted) return;
    const t = audio.currentTime;
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audio.destination);
    o.start(t);
    o.stop(t + dur);
  }
  const sfx = {
    shoot: () => beep(880, 0.07, "square", 0.025, -400),
    hit: () => beep(220, 0.08, "sawtooth", 0.04, -120),
    boom: () => { beep(120, 0.3, "sawtooth", 0.06, -90); beep(60, 0.35, "triangle", 0.06, -30); },
    meow: () => { beep(700, 0.12, "triangle", 0.06, 300); setTimeout(() => beep(900, 0.18, "triangle", 0.05, -500), 110); },
    power: () => { beep(520, 0.08, "sine", 0.06); setTimeout(() => beep(780, 0.08, "sine", 0.06), 70); setTimeout(() => beep(1040, 0.12, "sine", 0.06), 140); },
    hurt: () => beep(160, 0.25, "square", 0.07, -100),
  };

  // ---------- Input ----------
  const keys = new Set();
  window.addEventListener("keydown", (e) => {
    ensureAudio();
    const k = e.key.toLowerCase();
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) e.preventDefault();
    keys.add(k);
    if (k === "p" || k === "escape") togglePause();
    if (k === "m") muted = !muted;
    if ((k === "enter" || k === " ") && (state === "title" || state === "over")) startGame();
  });
  window.addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));

  const pointer = { active: false, x: W / 2, y: H - 120 };
  function toGame(e) {
    const r = canvas.getBoundingClientRect();
    return { x: ((e.clientX - r.left) / r.width) * W, y: ((e.clientY - r.top) / r.height) * H };
  }
  canvas.addEventListener("pointerdown", (e) => {
    ensureAudio();
    if (state === "title" || state === "over") { startGame(); return; }
    const p = toGame(e);
    pointer.active = true;
    pointer.x = p.x; pointer.y = p.y - 60; // keep cat above finger
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!pointer.active) return;
    const p = toGame(e);
    pointer.x = p.x; pointer.y = p.y - 60;
  });
  const endPointer = () => { pointer.active = false; };
  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);
  document.addEventListener("visibilitychange", () => { if (document.hidden && state === "play") togglePause(); });

  // ---------- Starfield ----------
  const stars = Array.from({ length: 140 }, () => ({
    x: rand(0, W), y: rand(0, H), z: rand(0.2, 1),
  }));
  const planets = [
    { x: 380, y: 160, r: 46, c1: "#6b4bd8", c2: "#2a1a6b", ring: true, speed: 6 },
    { x: 90, y: 520, r: 22, c1: "#ff8a65", c2: "#7a2e1a", ring: false, speed: 10 },
  ];
  function updateBackground(dt) {
    for (const s of stars) {
      s.y += (30 + 220 * s.z) * dt;
      if (s.y > H) { s.y = -2; s.x = rand(0, W); }
    }
    for (const p of planets) {
      p.y += p.speed * dt;
      if (p.y - p.r * 2 > H) { p.y = -p.r * 2; p.x = rand(40, W - 40); }
    }
  }
  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#0b0820");
    g.addColorStop(1, "#05040f");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    for (const p of planets) {
      const pg = ctx.createRadialGradient(p.x - p.r * 0.4, p.y - p.r * 0.4, p.r * 0.1, p.x, p.y, p.r);
      pg.addColorStop(0, p.c1);
      pg.addColorStop(1, p.c2);
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = pg;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      if (p.ring) {
        ctx.strokeStyle = "rgba(255,220,180,0.5)";
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r * 1.7, p.r * 0.4, -0.3, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    for (const s of stars) {
      ctx.fillStyle = `rgba(255,255,255,${0.3 + s.z * 0.7})`;
      const sz = s.z > 0.8 ? 2 : 1;
      ctx.fillRect(s.x, s.y, sz, sz + (s.z > 0.8 ? 2 : 0));
    }
  }

  // ---------- Cat drawing ----------
  function drawCatFace(x, y, s, fur, opts = {}) {
    const { stripe = null, eye = "#7dff7d", angry = false, blink = false } = opts;
    ctx.save();
    ctx.translate(x, y);
    // ears
    ctx.fillStyle = fur;
    ctx.beginPath();
    ctx.moveTo(-s * 0.9, -s * 0.2); ctx.lineTo(-s * 0.75, -s * 1.15); ctx.lineTo(-s * 0.2, -s * 0.75);
    ctx.moveTo(s * 0.9, -s * 0.2); ctx.lineTo(s * 0.75, -s * 1.15); ctx.lineTo(s * 0.2, -s * 0.75);
    ctx.fill();
    ctx.fillStyle = "#ffb3c7";
    ctx.beginPath();
    ctx.moveTo(-s * 0.72, -s * 0.4); ctx.lineTo(-s * 0.68, -s * 0.95); ctx.lineTo(-s * 0.35, -s * 0.7);
    ctx.moveTo(s * 0.72, -s * 0.4); ctx.lineTo(s * 0.68, -s * 0.95); ctx.lineTo(s * 0.35, -s * 0.7);
    ctx.fill();
    // head
    ctx.fillStyle = fur;
    ctx.beginPath(); ctx.ellipse(0, 0, s, s * 0.85, 0, 0, Math.PI * 2); ctx.fill();
    if (stripe) {
      ctx.strokeStyle = stripe;
      ctx.lineWidth = s * 0.12;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(0, -s * 0.8); ctx.lineTo(0, -s * 0.45);
      ctx.moveTo(-s * 0.3, -s * 0.75); ctx.lineTo(-s * 0.22, -s * 0.48);
      ctx.moveTo(s * 0.3, -s * 0.75); ctx.lineTo(s * 0.22, -s * 0.48);
      ctx.stroke();
    }
    // eyes
    if (blink) {
      ctx.strokeStyle = "#111"; ctx.lineWidth = s * 0.08;
      ctx.beginPath();
      ctx.moveTo(-s * 0.55, -s * 0.05); ctx.lineTo(-s * 0.2, -s * 0.05);
      ctx.moveTo(s * 0.2, -s * 0.05); ctx.lineTo(s * 0.55, -s * 0.05);
      ctx.stroke();
    } else {
      ctx.fillStyle = eye;
      ctx.beginPath();
      ctx.ellipse(-s * 0.38, -s * 0.05, s * 0.2, s * 0.24, 0, 0, Math.PI * 2);
      ctx.ellipse(s * 0.38, -s * 0.05, s * 0.2, s * 0.24, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#111";
      ctx.beginPath();
      ctx.ellipse(-s * 0.38, -s * 0.05, s * 0.06, s * 0.2, 0, 0, Math.PI * 2);
      ctx.ellipse(s * 0.38, -s * 0.05, s * 0.06, s * 0.2, 0, 0, Math.PI * 2);
      ctx.fill();
      if (angry) {
        ctx.strokeStyle = "#111"; ctx.lineWidth = s * 0.1;
        ctx.beginPath();
        ctx.moveTo(-s * 0.62, -s * 0.38); ctx.lineTo(-s * 0.18, -s * 0.22);
        ctx.moveTo(s * 0.62, -s * 0.38); ctx.lineTo(s * 0.18, -s * 0.22);
        ctx.stroke();
      }
    }
    // nose + mouth
    ctx.fillStyle = "#ff6f91";
    ctx.beginPath(); ctx.moveTo(-s * 0.1, s * 0.22); ctx.lineTo(s * 0.1, s * 0.22); ctx.lineTo(0, s * 0.34); ctx.fill();
    ctx.strokeStyle = "#222"; ctx.lineWidth = Math.max(1, s * 0.05);
    ctx.beginPath();
    ctx.moveTo(0, s * 0.34); ctx.quadraticCurveTo(-s * 0.12, s * 0.5, -s * 0.24, s * 0.4);
    ctx.moveTo(0, s * 0.34); ctx.quadraticCurveTo(s * 0.12, s * 0.5, s * 0.24, s * 0.4);
    ctx.stroke();
    // whiskers
    ctx.strokeStyle = "rgba(255,255,255,0.8)"; ctx.lineWidth = 1;
    ctx.beginPath();
    for (const side of [-1, 1]) {
      ctx.moveTo(side * s * 0.35, s * 0.3); ctx.lineTo(side * s * 1.25, s * 0.18);
      ctx.moveTo(side * s * 0.35, s * 0.38); ctx.lineTo(side * s * 1.25, s * 0.42);
    }
    ctx.stroke();
    ctx.restore();
  }

  // ---------- Entities ----------
  let player, bullets, enemyBullets, enemies, particles, pickups, floaters;
  let score, high = loadHigh(), wave, waveTimer, spawnQueue, state = "title", shake = 0, time = 0;
  let bannerText = "", bannerTime = 0;

  function newPlayer() {
    return {
      x: W / 2, y: H - 110, r: 18, hp: 5, maxHp: 5, lives: 3,
      cooldown: 0, invuln: 2, spread: 0, rapid: 0, shield: 0, blink: 0,
    };
  }

  function startGame() {
    ensureAudio();
    player = newPlayer();
    bullets = []; enemyBullets = []; enemies = []; particles = []; pickups = []; floaters = [];
    score = 0; wave = 0; waveTimer = 1; spawnQueue = [];
    state = "play";
    sfx.meow();
  }

  function togglePause() {
    if (state === "play") state = "paused";
    else if (state === "paused") state = "play";
  }

  const ENEMY_TYPES = {
    kitten: { r: 15, hp: 1, speed: 110, fur: "#8f7cff", stripe: null, eye: "#ffe066", score: 100, fire: 0 },
    tabby:  { r: 18, hp: 3, speed: 80,  fur: "#3ddc97", stripe: "#1d7a52", eye: "#ff5e5e", score: 250, fire: 2.2 },
    zoomie: { r: 14, hp: 2, speed: 170, fur: "#ff5ec4", stripe: null, eye: "#7df9ff", score: 200, fire: 0 },
    tank:   { r: 26, hp: 10, speed: 45, fur: "#6d6d8a", stripe: "#3b3b52", eye: "#ff9f1c", score: 600, fire: 1.4 },
    boss:   { r: 58, hp: 140, speed: 40, fur: "#b14aed", stripe: "#5a1d82", eye: "#ff2e2e", score: 5000, fire: 0.5 },
  };

  function spawnEnemy(type, x, y, extra = {}) {
    const t = ENEMY_TYPES[type];
    const hpScale = type === "boss" ? 1 + (wave / 5 - 1) * 0.5 : 1 + Math.floor(wave / 4) * 0.5;
    enemies.push({
      type, x, y, r: t.r, hp: Math.ceil(t.hp * hpScale), maxHp: Math.ceil(t.hp * hpScale),
      speed: t.speed * (1 + wave * 0.03), t: 0, phase: rand(0, Math.PI * 2),
      fireTimer: t.fire ? rand(0.5, t.fire) : 0, flash: 0, baseX: x, ...extra,
    });
  }

  function buildWave(n) {
    const q = [];
    if (n % 5 === 0) {
      q.push({ delay: 1.2, fn: () => spawnEnemy("boss", W / 2, -70) });
      return q;
    }
    const count = 6 + n * 2;
    for (let i = 0; i < count; i++) {
      const roll = Math.random();
      let type = "kitten";
      if (n >= 2 && roll < 0.25) type = "zoomie";
      if (n >= 3 && roll > 0.72) type = "tabby";
      if (n >= 4 && roll > 0.92) type = "tank";
      q.push({ delay: rand(0.35, 0.9) * Math.max(0.5, 1 - n * 0.04), fn: () => spawnEnemy(type, rand(40, W - 40), -30) });
    }
    // formation
    if (n >= 2) {
      q.push({ delay: 0.8, fn: () => { for (let i = 0; i < 5; i++) spawnEnemy("kitten", 80 + i * 80, -30 - i * 30); } });
    }
    return q;
  }

  function fireEnemyBullet(e, angle, speed, kind = "hairball") {
    enemyBullets.push({ x: e.x, y: e.y + e.r * 0.6, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, r: kind === "big" ? 9 : 6, kind });
  }

  function burst(x, y, color, n = 16, spd = 180) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), v = rand(spd * 0.3, spd);
      particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.4, 0.9), max: 0.9, color, size: rand(2, 4) });
    }
  }

  function floatText(x, y, text, color = "#fff") {
    floaters.push({ x, y, text, color, life: 1 });
  }

  const PICKUPS = {
    fish:   { color: "#7fd3ff", label: "FISH" },
    yarn:   { color: "#ff6fae", label: "YARN" },
    catnip: { color: "#7dff7d", label: "CATNIP" },
    box:    { color: "#d9a066", label: "BOX" },
  };
  function maybeDrop(e) {
    const chance = e.type === "boss" ? 1 : e.type === "tank" ? 0.5 : 0.1;
    if (Math.random() > chance) return;
    const kinds = Object.keys(PICKUPS);
    const kind = player.hp < player.maxHp && Math.random() < 0.35 ? "fish" : kinds[Math.floor(Math.random() * kinds.length)];
    pickups.push({ x: e.x, y: e.y, r: 14, kind, t: 0 });
  }

  function damagePlayer(amount) {
    if (player.invuln > 0) return;
    if (player.shield > 0) {
      player.shield = 0;
      player.invuln = 0.8;
      burst(player.x, player.y, "#d9a066", 20);
      sfx.hit();
      return;
    }
    player.hp -= amount;
    player.invuln = 1.2;
    shake = 12;
    sfx.hurt();
    burst(player.x, player.y, "#ffb347", 18);
    if (player.hp <= 0) {
      player.lives--;
      burst(player.x, player.y, "#ffb347", 50, 300);
      sfx.boom();
      if (player.lives <= 0) {
        state = "over";
        if (score > high) { high = score; saveHigh(high); }
      } else {
        player.hp = player.maxHp;
        player.invuln = 2.5;
        player.spread = 0; player.rapid = 0;
        player.x = W / 2; player.y = H - 110;
        bannerText = "9 LIVES... " + player.lives + " LEFT"; bannerTime = 2;
      }
    }
  }

  // ---------- Update ----------
  function update(dt) {
    time += dt;
    updateBackground(dt);
    if (state !== "play") {
      for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
      if (particles) particles = particles.filter((p) => p.life > 0);
      return;
    }

    // waves
    if (spawnQueue.length) {
      waveTimer -= dt;
      while (spawnQueue.length && waveTimer <= 0) {
        const next = spawnQueue.shift();
        next.fn();
        waveTimer += spawnQueue.length ? spawnQueue[0].delay : 0;
      }
    } else if (enemies.length === 0) {
      waveTimer -= dt;
      if (waveTimer <= 0) {
        wave++;
        spawnQueue = buildWave(wave);
        waveTimer = spawnQueue[0].delay;
        bannerText = wave % 5 === 0 ? "BOSS: MEGA TOM" : "WAVE " + wave;
        bannerTime = 2;
        if (wave > 1) sfx.meow();
      }
    } else {
      waveTimer = 1.5;
    }

    // player movement
    const p = player;
    const sp = 320;
    let dx = 0, dy = 0;
    if (keys.has("arrowleft") || keys.has("a")) dx -= 1;
    if (keys.has("arrowright") || keys.has("d")) dx += 1;
    if (keys.has("arrowup") || keys.has("w")) dy -= 1;
    if (keys.has("arrowdown") || keys.has("s")) dy += 1;
    if (dx || dy) {
      const len = Math.hypot(dx, dy);
      p.x += (dx / len) * sp * dt;
      p.y += (dy / len) * sp * dt;
    } else if (pointer.active) {
      p.x += (pointer.x - p.x) * Math.min(1, dt * 14);
      p.y += (pointer.y - p.y) * Math.min(1, dt * 14);
    }
    p.x = clamp(p.x, p.r, W - p.r);
    p.y = clamp(p.y, H * 0.3, H - p.r - 10);

    p.invuln = Math.max(0, p.invuln - dt);
    p.spread = Math.max(0, p.spread - dt);
    p.rapid = Math.max(0, p.rapid - dt);
    p.shield = Math.max(0, p.shield - dt);
    p.cooldown -= dt;
    p.blink -= dt;
    if (p.blink < -3) p.blink = 0.15;

    const firing = keys.has(" ") || keys.has("j") || keys.has("z") || pointer.active;
    if (firing && p.cooldown <= 0) {
      p.cooldown = p.rapid > 0 ? 0.075 : 0.16;
      const angles = p.spread > 0 ? [-0.28, -0.14, 0, 0.14, 0.28] : [0];
      for (const a of angles) {
        bullets.push({ x: p.x, y: p.y - p.r, vx: Math.sin(a) * 620, vy: -Math.cos(a) * 620, r: 4 });
      }
      sfx.shoot();
    }

    // bullets
    for (const b of bullets) { b.x += b.vx * dt; b.y += b.vy * dt; }
    bullets = bullets.filter((b) => b.y > -20 && b.x > -20 && b.x < W + 20 && !b.dead);

    for (const b of enemyBullets) { b.x += b.vx * dt; b.y += b.vy * dt; }
    enemyBullets = enemyBullets.filter((b) => b.y < H + 20 && b.y > -40 && b.x > -20 && b.x < W + 20 && !b.dead);

    // enemies
    for (const e of enemies) {
      e.t += dt;
      e.flash = Math.max(0, e.flash - dt);
      const def = ENEMY_TYPES[e.type];
      if (e.type === "boss") {
        const targetY = 130;
        if (e.y < targetY) e.y += e.speed * dt * 2;
        e.x = W / 2 + Math.sin(e.t * 0.7) * (W / 2 - 80);
        e.fireTimer -= dt;
        if (e.fireTimer <= 0 && e.y >= targetY - 2) {
          const enraged = e.hp < e.maxHp * 0.4;
          e.fireTimer = enraged ? 0.35 : 0.55;
          const pattern = Math.floor(e.t / 3) % 3;
          if (pattern === 0) {
            const base = Math.atan2(p.y - e.y, p.x - e.x);
            for (const off of [-0.25, 0, 0.25]) fireEnemyBullet(e, base + off, 230);
          } else if (pattern === 1) {
            const n = enraged ? 14 : 10;
            for (let i = 0; i < n; i++) fireEnemyBullet(e, (i / n) * Math.PI * 2 + e.t, 150);
          } else {
            fireEnemyBullet(e, Math.PI / 2 + Math.sin(e.t * 4) * 0.6, 260, "big");
          }
        }
      } else {
        e.y += e.speed * dt;
        if (e.type === "zoomie") e.x = e.baseX + Math.sin(e.t * 5 + e.phase) * 70;
        else if (e.type === "kitten") e.x = e.baseX + Math.sin(e.t * 2 + e.phase) * 25;
        else if (e.type === "tabby" && e.y > 180) e.speed = Math.max(def.speed * 0.4, e.speed - dt * 60);
        e.x = clamp(e.x, e.r, W - e.r);
        if (def.fire) {
          e.fireTimer -= dt;
          if (e.fireTimer <= 0 && e.y > 0 && e.y < H * 0.75) {
            e.fireTimer = def.fire * rand(0.8, 1.2);
            const a = Math.atan2(p.y - e.y, p.x - e.x);
            if (e.type === "tank") for (const off of [-0.2, 0, 0.2]) fireEnemyBullet(e, a + off, 180);
            else fireEnemyBullet(e, a, 210);
          }
        }
      }

      for (const b of bullets) {
        if (!b.dead && hit(b, e)) {
          b.dead = true;
          e.hp--;
          e.flash = 0.08;
          burst(b.x, b.y, "#fff2a8", 4, 120);
          if (e.hp <= 0 && !e.dead) {
            e.dead = true;
            const pts = def.score * (1 + Math.floor(wave / 5));
            score += pts;
            floatText(e.x, e.y, "+" + pts, "#ffe066");
            burst(e.x, e.y, def.fur, e.type === "boss" ? 120 : 26, e.type === "boss" ? 400 : 220);
            shake = e.type === "boss" ? 25 : Math.max(shake, 4);
            sfx.boom();
            maybeDrop(e);
            if (e.type === "boss") { bannerText = "MEGA TOM DEFEATED!"; bannerTime = 2.5; enemyBullets = []; }
          } else {
            sfx.hit();
          }
        }
      }

      if (!e.dead && hit(e, p)) {
        damagePlayer(e.type === "boss" ? 2 : 1);
        if (e.type !== "boss") {
          e.dead = true;
          burst(e.x, e.y, def.fur, 20);
        }
      }
      if (e.y - e.r > H) e.dead = true;
    }
    enemies = enemies.filter((e) => !e.dead);

    for (const b of enemyBullets) {
      if (hit(b, p)) { b.dead = true; damagePlayer(b.kind === "big" ? 2 : 1); }
    }

    // pickups
    for (const k of pickups) {
      k.t += dt;
      k.y += 70 * dt;
      k.x += Math.sin(k.t * 3) * 30 * dt;
      if (hit(k, p)) {
        k.dead = true;
        sfx.power();
        if (k.kind === "fish") { p.hp = Math.min(p.maxHp, p.hp + 2); floatText(p.x, p.y - 30, "NOM NOM", "#7fd3ff"); }
        if (k.kind === "yarn") { p.spread = 10; floatText(p.x, p.y - 30, "YARN SPREAD!", "#ff6fae"); }
        if (k.kind === "catnip") { p.rapid = 8; floatText(p.x, p.y - 30, "CATNIP FRENZY!", "#7dff7d"); }
        if (k.kind === "box") { p.shield = 12; floatText(p.x, p.y - 30, "IF I FITS I SITS", "#d9a066"); }
        score += 50;
      }
    }
    pickups = pickups.filter((k) => !k.dead && k.y < H + 30);

    // fx
    for (const q of particles) { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.98; q.vy *= 0.98; q.life -= dt; }
    particles = particles.filter((q) => q.life > 0);
    for (const f of floaters) { f.y -= 40 * dt; f.life -= dt; }
    floaters = floaters.filter((f) => f.life > 0);
    bannerTime = Math.max(0, bannerTime - dt);
    shake = Math.max(0, shake - dt * 40);
  }

  // ---------- Draw ----------
  function drawPlayer() {
    const p = player;
    if (p.invuln > 0 && Math.floor(time * 15) % 2 === 0) return;
    ctx.save();
    ctx.translate(p.x, p.y);
    // thruster flame
    const fl = 14 + Math.sin(time * 40) * 5;
    const fg = ctx.createLinearGradient(0, 18, 0, 18 + fl);
    fg.addColorStop(0, "#fff6a8"); fg.addColorStop(0.5, "#ff9a3c"); fg.addColorStop(1, "rgba(255,60,0,0)");
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.moveTo(-8, 18); ctx.lineTo(8, 18); ctx.lineTo(0, 18 + fl * 1.5); ctx.fill();
    // ship body
    ctx.fillStyle = "#d8dcef";
    ctx.beginPath();
    ctx.moveTo(0, -30); ctx.lineTo(24, 14); ctx.lineTo(12, 22); ctx.lineTo(-12, 22); ctx.lineTo(-24, 14);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#ff6f61";
    ctx.beginPath(); ctx.moveTo(24, 14); ctx.lineTo(34, 24); ctx.lineTo(14, 20); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-24, 14); ctx.lineTo(-34, 24); ctx.lineTo(-14, 20); ctx.fill();
    ctx.restore();
    // pilot cat in helmet bubble
    drawCatFace(p.x, p.y - 2, 12, "#ffa64d", { stripe: "#d9731a", eye: "#7dff7d", blink: p.blink > 0 });
    ctx.strokeStyle = "rgba(180,230,255,0.8)";
    ctx.fillStyle = "rgba(180,230,255,0.15)";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y - 4, 17, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    if (p.shield > 0) {
      ctx.strokeStyle = `rgba(217,160,102,${0.5 + Math.sin(time * 8) * 0.3})`;
      ctx.lineWidth = 3;
      ctx.strokeRect(p.x - 32, p.y - 34, 64, 64);
    }
  }

  function drawEnemy(e) {
    const def = ENEMY_TYPES[e.type];
    const s = e.r;
    // saucer
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.fillStyle = e.type === "boss" ? "#3a2259" : "#3b3f5c";
    ctx.beginPath(); ctx.ellipse(0, s * 0.55, s * 1.35, s * 0.45, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#565b82";
    ctx.beginPath(); ctx.ellipse(0, s * 0.45, s * 1.35, s * 0.3, 0, 0, Math.PI * 2); ctx.fill();
    for (let i = -2; i <= 2; i++) {
      ctx.fillStyle = Math.floor(time * 6 + i) % 2 ? "#ffe066" : "#ff5e5e";
      ctx.beginPath(); ctx.arc(i * s * 0.5, s * 0.6, Math.max(2, s * 0.08), 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    drawCatFace(e.x, e.y - s * 0.1, s * 0.75, e.flash > 0 ? "#ffffff" : def.fur, { stripe: def.stripe, eye: def.eye, angry: true });
    if (e.type === "boss") {
      // crown
      ctx.fillStyle = "#ffd23f";
      ctx.beginPath();
      const cy = e.y - s * 0.95;
      ctx.moveTo(e.x - 22, cy + 10); ctx.lineTo(e.x - 22, cy - 6); ctx.lineTo(e.x - 11, cy + 2);
      ctx.lineTo(e.x, cy - 12); ctx.lineTo(e.x + 11, cy + 2); ctx.lineTo(e.x + 22, cy - 6); ctx.lineTo(e.x + 22, cy + 10);
      ctx.fill();
      // hp bar
      const bw = W - 60;
      ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(30, 54, bw, 10);
      ctx.fillStyle = e.hp < e.maxHp * 0.4 ? "#ff2e63" : "#b14aed";
      ctx.fillRect(30, 54, bw * (e.hp / e.maxHp), 10);
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 1; ctx.strokeRect(30, 54, bw, 10);
      ctx.fillStyle = "#fff"; ctx.font = "bold 11px 'Trebuchet MS', sans-serif"; ctx.textAlign = "center";
      ctx.fillText("MEGA TOM", W / 2, 50);
    } else if (e.maxHp > 2) {
      ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(e.x - s, e.y - s - 10, s * 2, 4);
      ctx.fillStyle = "#7dff7d"; ctx.fillRect(e.x - s, e.y - s - 10, s * 2 * (e.hp / e.maxHp), 4);
    }
  }

  function drawPickup(k) {
    const def = PICKUPS[k.kind];
    ctx.save();
    ctx.translate(k.x, k.y);
    ctx.shadowColor = def.color; ctx.shadowBlur = 14;
    if (k.kind === "fish") {
      ctx.fillStyle = def.color;
      ctx.beginPath(); ctx.ellipse(0, 0, 12, 7, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(18, -7); ctx.lineTo(18, 7); ctx.fill();
      ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(-6, -2, 1.8, 0, Math.PI * 2); ctx.fill();
    } else if (k.kind === "yarn") {
      ctx.rotate(k.t * 2);
      ctx.fillStyle = def.color;
      ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#b8336a"; ctx.lineWidth = 1.5;
      for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.ellipse(0, 0, 11, 4 + Math.abs(i) * 3, i * 0.9, 0, Math.PI * 2); ctx.stroke(); }
    } else if (k.kind === "catnip") {
      ctx.rotate(Math.sin(k.t * 3) * 0.3);
      ctx.fillStyle = def.color;
      for (let i = 0; i < 3; i++) {
        ctx.save(); ctx.rotate((i - 1) * 0.7);
        ctx.beginPath(); ctx.ellipse(0, -7, 4.5, 9, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
      ctx.strokeStyle = "#2e8b57"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 12); ctx.stroke();
    } else if (k.kind === "box") {
      ctx.fillStyle = def.color;
      ctx.fillRect(-12, -9, 24, 18);
      ctx.strokeStyle = "#8a5a2b"; ctx.lineWidth = 1.5;
      ctx.strokeRect(-12, -9, 24, 18);
      ctx.beginPath(); ctx.moveTo(-12, -9); ctx.lineTo(-17, -15); ctx.moveTo(12, -9); ctx.lineTo(17, -15); ctx.stroke();
    }
    ctx.restore();
  }

  function drawHUD() {
    ctx.textAlign = "left";
    ctx.fillStyle = "#fff";
    ctx.font = "bold 18px 'Trebuchet MS', sans-serif";
    ctx.fillText("SCORE " + score, 14, 26);
    ctx.textAlign = "right";
    ctx.fillStyle = "#9a93c9";
    ctx.font = "13px 'Trebuchet MS', sans-serif";
    ctx.fillText("HI " + Math.max(high, score) + "   WAVE " + wave, W - 14, 24);

    // hp hearts (paws)
    for (let i = 0; i < player.maxHp; i++) {
      const x = 22 + i * 24, y = H - 22;
      ctx.fillStyle = i < player.hp ? "#ff6f91" : "rgba(255,255,255,0.15)";
      ctx.beginPath(); ctx.ellipse(x, y + 3, 7, 6, 0, 0, Math.PI * 2); ctx.fill();
      for (const [ox, oy] of [[-6, -5], [-2, -8], [2, -8], [6, -5]]) {
        ctx.beginPath(); ctx.arc(x + ox, y + oy, 2.6, 0, Math.PI * 2); ctx.fill();
      }
    }
    // lives
    ctx.textAlign = "right";
    ctx.fillStyle = "#ffb347";
    ctx.font = "bold 14px 'Trebuchet MS', sans-serif";
    ctx.fillText("LIVES x" + player.lives, W - 14, H - 16);

    // active powerups
    let px = 14, py = H - 46;
    ctx.textAlign = "left";
    ctx.font = "bold 11px 'Trebuchet MS', sans-serif";
    for (const [k, v, c] of [["YARN", player.spread, "#ff6fae"], ["CATNIP", player.rapid, "#7dff7d"], ["BOX", player.shield, "#d9a066"]]) {
      if (v > 0) {
        ctx.fillStyle = c;
        ctx.fillText(k + " " + v.toFixed(1) + "s", px, py);
        py -= 14;
      }
    }
  }

  function centerText(text, y, size, color = "#fff", weight = "bold") {
    ctx.textAlign = "center";
    ctx.font = `${weight} ${size}px 'Trebuchet MS', sans-serif`;
    ctx.fillStyle = color;
    ctx.fillText(text, W / 2, y);
  }

  function drawTitle() {
    const bob = Math.sin(time * 2) * 8;
    drawCatFace(W / 2, 230 + bob, 54, "#ffa64d", { stripe: "#d9731a", eye: "#7dff7d", blink: Math.floor(time * 10) % 30 === 0 });
    ctx.strokeStyle = "rgba(180,230,255,0.8)"; ctx.fillStyle = "rgba(180,230,255,0.12)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(W / 2, 222 + bob, 78, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    centerText("SPACE CATS", 370, 52, "#ffb347");
    centerText("The Galactic Hiss-tory", 402, 18, "#9a93c9", "normal");
    const lines = [
      "Move: WASD / Arrows  ·  Fire: Space",
      "Touch: drag to move (auto-fire)",
      "P: pause  ·  M: mute",
    ];
    lines.forEach((l, i) => centerText(l, 460 + i * 22, 14, "#d9d4ff", "normal"));
    const pick = [["fish", "heal"], ["yarn", "spread"], ["catnip", "rapid"], ["box", "shield"]];
    pick.forEach(([k, label], i) => {
      const x = 75 + i * 110;
      drawPickup({ x, y: 548, kind: k, t: time });
      ctx.textAlign = "center"; ctx.font = "12px 'Trebuchet MS', sans-serif"; ctx.fillStyle = PICKUPS[k].color;
      ctx.fillText(label, x, 578);
    });
    if (Math.floor(time * 2) % 2 === 0) centerText("PRESS ENTER OR TAP TO LAUNCH", 640, 18, "#fff");
    if (high) centerText("HIGH SCORE " + high, 675, 14, "#9a93c9", "normal");
  }

  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);
    drawBackground();

    if (state === "title") {
      drawTitle();
      ctx.restore();
      return;
    }

    for (const k of pickups) drawPickup(k);
    for (const e of enemies) drawEnemy(e);

    // player lasers (laser pointer dots!)
    for (const b of bullets) {
      ctx.fillStyle = "#ff3b3b";
      ctx.shadowColor = "#ff3b3b"; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.ellipse(b.x, b.y, 3, 9, Math.atan2(b.vx, -b.vy), 0, Math.PI * 2); ctx.fill();
    }
    ctx.shadowBlur = 0;
    // enemy hairballs
    for (const b of enemyBullets) {
      ctx.fillStyle = b.kind === "big" ? "#c77dff" : "#a3e635";
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,0.35)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(b.x - b.r * 0.2, b.y - b.r * 0.2, b.r * 0.5, 0, Math.PI * 1.4); ctx.stroke();
    }

    if (state !== "over") drawPlayer();

    for (const q of particles) {
      ctx.globalAlpha = clamp(q.life / q.max, 0, 1);
      ctx.fillStyle = q.color;
      ctx.fillRect(q.x, q.y, q.size, q.size);
    }
    ctx.globalAlpha = 1;
    for (const f of floaters) {
      ctx.globalAlpha = clamp(f.life, 0, 1);
      ctx.textAlign = "center"; ctx.font = "bold 14px 'Trebuchet MS', sans-serif"; ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;

    drawHUD();

    if (bannerTime > 0) {
      ctx.globalAlpha = Math.min(1, bannerTime);
      centerText(bannerText, H * 0.42, 34, "#ffb347");
      ctx.globalAlpha = 1;
    }

    if (state === "paused") {
      ctx.fillStyle = "rgba(5,4,15,0.6)"; ctx.fillRect(0, 0, W, H);
      centerText("PAUSED", H / 2, 44);
      centerText("Cat nap in progress... press P", H / 2 + 34, 16, "#9a93c9", "normal");
    }
    if (state === "over") {
      ctx.fillStyle = "rgba(5,4,15,0.7)"; ctx.fillRect(0, 0, W, H);
      centerText("GAME OVER", H / 2 - 40, 48, "#ff6f91");
      centerText("All nine lives spent.", H / 2 - 6, 16, "#9a93c9", "normal");
      centerText("SCORE " + score, H / 2 + 34, 26);
      centerText(score >= high && score > 0 ? "NEW HIGH SCORE!" : "HIGH " + high, H / 2 + 62, 16, "#ffe066");
      if (Math.floor(time * 2) % 2 === 0) centerText("ENTER / TAP TO PLAY AGAIN", H / 2 + 110, 16);
    }
    ctx.restore();
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  particles = [];
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
